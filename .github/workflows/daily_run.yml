name: Daily Python Run

on:
  schedule:
    # 0 1 * * * means 01:00 UTC+0 everyday.
    - cron: '0 1 * * *'
  
  # This button lets you trigger the script manually from the website to test it
  workflow_dispatch:

jobs:
  execute-job:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repo files into the virtual machine
      - name: Check out repo code
        uses: actions/checkout@v4

      # Step 2: Install Python on the machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install libraries from requirements.txt (if the file exists)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Run your script (replace main.py with your file name)
      - name: Run script
        run: python tiktok.py
